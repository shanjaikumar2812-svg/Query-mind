[project]
name = "querymind"
version = "0.1.0"
description = "QueryMind - NLP to SQL analytics chatbot"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "flask-sqlalchemy==3.1.1",
    "flask-cors==5.0.1",
    "flask-limiter==4.1.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.36",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.2",
    "groq==1.7.0",
    "nltk==3.8.1",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "weasyprint==62.1",
    "pdfkit==1.0.0",
    "chardet==5.2.0",
    "werkzeug==3.0.3",
    "gunicorn==21.2.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "run:app"