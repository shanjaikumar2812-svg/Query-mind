<!-- ================= DATASET HEALTH ================= -->
<div class="bg-white rounded-2xl border border-black/[0.08] p-5 shadow-apple-card" id="health-card">
  <div class="flex items-center justify-between pb-3.5 border-b border-black/[0.05]">
    <div class="flex items-center gap-2">
      <i class="bi bi-activity text-[15px] text-apple-subtle"></i>
      <h2 class="text-[11px] font-semibold uppercase tracking-wider text-apple-subtle m-0">Dataset Health</h2>
    </div>
    <span class="text-[10px] font-medium font-mono text-emerald-600 bg-emerald-500/10 px-2 py-0.5 rounded-full" id="health-badge">—</span>
  </div>

  <div class="grid grid-cols-2 gap-2.5 mt-4">
    <div class="bg-[#f5f5f7]/80 p-3 rounded-xl border border-black/[0.03]">
      <span class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block">Total Rows</span>
      <span class="text-[17px] font-semibold text-apple-ink font-mono tracking-tight" id="stat-rows">—</span>
    </div>
    <div class="bg-[#f5f5f7]/80 p-3 rounded-xl border border-black/[0.03]">
      <span class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block">Columns</span>
      <span class="text-[17px] font-semibold text-apple-ink font-mono tracking-tight" id="stat-cols">—</span>
    </div>
    <div class="bg-[#f5f5f7]/80 p-3 rounded-xl border border-black/[0.03]">
      <span class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block">Missing</span>
      <span class="text-[17px] font-semibold text-emerald-600 font-mono tracking-tight" id="stat-missing">—</span>
    </div>
    <div class="bg-[#f5f5f7]/80 p-3 rounded-xl border border-black/[0.03]">
      <span class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block">Duplicates</span>
      <span class="text-[17px] font-semibold text-apple-ink font-mono tracking-tight" id="stat-duplicates">—</span>
    </div>
  </div>

  <div class="mt-4 pt-3.5 border-t border-black/[0.05]">
    <div class="flex justify-between items-center text-[11px] mb-1.5">
      <span class="text-apple-subtle font-normal">Quality Confidence</span>
      <span class="text-apple-ink font-mono font-medium" id="quality-label">—</span>
    </div>
    <div class="w-full bg-[#f5f5f7] h-1.5 rounded-full overflow-hidden">
      <div class="bg-apple-tint h-full rounded-full transition-all duration-500" style="width:0%" id="quality-bar"></div>
    </div>
  </div>
</div>

<!-- ================= SCHEMA PROFILE ================= -->
<div class="bg-white rounded-2xl border border-black/[0.08] p-5 shadow-apple-card">
  <div class="flex items-center justify-between pb-3.5 border-b border-black/[0.05]">
    <div class="flex items-center gap-2">
      <i class="bi bi-table text-[15px] text-apple-subtle"></i>
      <h2 class="text-[11px] font-semibold uppercase tracking-wider text-apple-subtle m-0">Schema Profile</h2>
    </div>
    <span class="text-[10px] font-mono text-apple-muted" id="schema-count">—</span>
  </div>

  <div class="mt-3 divide-y divide-black/[0.04] max-h-[340px] overflow-y-auto pr-1" id="column-list">
    <div class="py-6 text-center text-[12px] text-apple-muted">Loading schema…</div>
  </div>
</div>

<!-- ================= HORIZON FORECASTING ================= -->
<div class="bg-white rounded-2xl border border-black/[0.08] p-5 shadow-apple-card">
  <div class="flex items-center gap-2 mb-3">
    <div class="w-6 h-6 rounded-md bg-black/[0.03] border border-black/[0.04] flex items-center justify-center text-apple-ink">
      <i class="bi bi-graph-up-arrow text-[13px]"></i>
    </div>
    <h3 class="text-[12px] font-semibold text-apple-ink tracking-tight m-0">Horizon Forecasting</h3>
  </div>

  <!-- Shown when the dataset has no usable date/value pair -->
  <div class="p-3 bg-[#f5f5f7]/70 rounded-xl border border-black/[0.03] text-[12px] text-apple-subtle leading-relaxed flex items-start gap-2 hidden" id="forecast-empty">
    <i class="bi bi-info-circle text-[13px] text-apple-muted shrink-0 mt-0.5"></i>
    <p class="m-0">No time-series column detected. Forecasting requires a date column and a numeric value column.</p>
  </div>

  <div id="forecast-controls" class="hidden space-y-2.5">
    <div>
      <label class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block mb-1" for="forecast-date-col">Date column</label>
      <select id="forecast-date-col"
              class="w-full text-[12px] font-mono rounded-lg border-black/[0.1] bg-[#f5f5f7]/70 py-1.5 focus:border-apple-tint focus:ring-0"></select>
    </div>
    <div>
      <label class="text-[10px] uppercase font-mono text-apple-muted tracking-wider block mb-1" for="forecast-value-col">Value column</label>
      <select id="forecast-value-col"
              class="w-full text-[12px] font-mono rounded-lg border-black/[0.1] bg-[#f5f5f7]/70 py-1.5 focus:border-apple-tint focus:ring-0"></select>
    </div>
    <button type="button" id="forecast-btn"
            class="w-full mt-1 px-3 py-1.5 rounded-lg bg-apple-ink hover:bg-[#333336] text-white text-[12px] font-medium transition-colors active:scale-[0.98] flex items-center justify-center gap-1.5">
      <span class="btn-label">Run forecast</span>
      <span class="qm-spinner hidden"></span>
    </button>

    <div class="hidden pt-2" id="forecast-chart-card">
      <div class="qm-chart-wrap qm-chart-wrap-sm">
        <canvas id="forecast-chart"></canvas>
      </div>
      <p class="text-[10px] font-mono text-apple-muted text-center mt-1" id="forecast-method"></p>
    </div>
  </div>
</div>
